name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # The compiled extensions are what production actually runs. CI used never to
  # build them, so the deployed code path was untested -- and at one point 12
  # tests failed under it while CI stayed green.
  compiled:
    name: compiled extensions (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython>=3.0" pytest flask
      - name: Build extensions
        run: python setup.py build_ext --inplace
      - name: Verify the extensions really did load
        run: |
          python - <<'PY'
          from janggi.search import _HAVE_CORE
          from janggi.board import _HAVE_CATTACK, _HAVE_CMOVEGEN
          assert _HAVE_CORE and _HAVE_CATTACK and _HAVE_CMOVEGEN, "extensions did not load"
          print("compiled search core active")
          PY
      - name: Test
        run: python -m pytest tests/ -q

  # The pure-Python fallback is what runs if the build fails at deploy time, so
  # it has to keep working and keep agreeing with the compiled path.
  pure-python:
    name: pure-Python fallback (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install pytest flask
      - name: Test
        env:
          JANGGI_NO_ACCEL: "1"
        run: python -m pytest tests/ -q

  # A self-play game exercises the whole stack the way a user does, and catches
  # anything that only shows up over a long sequence of real searches.
  selfplay:
    name: self-play smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython>=3.0"
      - run: python setup.py build_ext --inplace
      - run: python -m janggi.cli --selfplay --moves 40 --depth 7
      - name: Engine must not lose to itself with a feature disabled by accident
        run: python -m janggi.match --games 2 --nodes 20000
